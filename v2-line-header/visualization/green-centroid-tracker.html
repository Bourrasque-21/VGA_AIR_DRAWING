  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

      &lt;rect x=&quot;1228&quot; y=&quot;160&quot; width=&quot;135&quot; height=&quot;120&quot; class=&quot;gc-gate&quot;&gt;&lt;/rect&gt;
      &lt;g id=&quot;gc3-gate-accepted&quot;&gt;&lt;/g&gt;
      &lt;circle cx=&quot;1318&quot; cy=&quot;226&quot; r=&quot;10&quot; class=&quot;gc-centroid&quot;&gt;&lt;/circle&gt;
      &lt;line x1=&quot;1303&quot; y1=&quot;226&quot; x2=&quot;1333&quot; y2=&quot;226&quot; stroke=&quot;var(--viz-series-1)&quot; stroke-width=&quot;3&quot;&gt;&lt;/line&gt;
      &lt;line x1=&quot;1318&quot; y1=&quot;211&quot; x2=&quot;1318&quot; y2=&quot;241&quot; stroke=&quot;var(--viz-series-1)&quot; stroke-width=&quot;3&quot;&gt;&lt;/line&gt;
      &lt;text x=&quot;1295&quot; y=&quot;392&quot; text-anchor=&quot;middle&quot;&gt;새 중심으로 gate가 이동&lt;/text&gt;
      &lt;text x=&quot;1295&quot; y=&quot;420&quot; text-anchor=&quot;middle&quot; class=&quot;gc-muted&quot;&gt;펜을 놓치면 최대 3프레임 뒤 추적 해제&lt;/text&gt;
    &lt;/svg&gt;
  &lt;/section&gt;

  &lt;section class=&quot;gc-section&quot; aria-labelledby=&quot;gc3-compare-heading&quot;&gt;
    &lt;h2 id=&quot;gc3-compare-heading&quot;&gt;C · 바운딩박스 중점과 센트로이드의 차이&lt;/h2&gt;
    &lt;svg class=&quot;gc-svg&quot; viewBox=&quot;0 0 1560 520&quot; role=&quot;img&quot; aria-labelledby=&quot;gc3-compare-title gc3-compare-desc&quot;&gt;
      &lt;title id=&quot;gc3-compare-title&quot;&gt;동일한 녹색 픽셀과 한 개의 먼 오검출에 대한 중점, 센트로이드, 게이트 센트로이드 비교&lt;/title&gt;
      &lt;desc id=&quot;gc3-compare-desc&quot;&gt;바운딩박스 중점은 한 개의 먼 픽셀이 최대 좌표를 바꾸어 크게 이동하지만, 센트로이드는 모든 픽셀의 평균이라 영향이 작고 게이트를 함께 사용하면 먼 픽셀을 완전히 제외한다.&lt;/desc&gt;
      &lt;text x=&quot;40&quot; y=&quot;40&quot; class=&quot;gc-strong&quot;&gt;① 바운딩박스 중점&lt;/text&gt;
      &lt;text x=&quot;40&quot; y=&quot;70&quot; class=&quot;gc-muted&quot;&gt;중심 = (min + max) ÷ 2&lt;/text&gt;
      &lt;rect x=&quot;40&quot; y=&quot;95&quot; width=&quot;450&quot; height=&quot;315&quot; class=&quot;gc-grid&quot;&gt;&lt;/rect&gt;
      &lt;g id=&quot;gc3-midpoint-points&quot;&gt;&lt;/g&gt;
      &lt;rect id=&quot;gc3-bbox&quot; x=&quot;0&quot; y=&quot;0&quot; width=&quot;0&quot; height=&quot;0&quot; class=&quot;gc-outline&quot;&gt;&lt;/rect&gt;
      &lt;circle id=&quot;gc3-midpoint-mark&quot; cx=&quot;0&quot; cy=&quot;0&quot; r=&quot;10&quot; class=&quot;gc-midpoint&quot;&gt;&lt;/circle&gt;
      &lt;text id=&quot;gc3-midpoint-label&quot; x=&quot;265&quot; y=&quot;444&quot; text-anchor=&quot;middle&quot; class=&quot;gc-strong&quot;&gt;&lt;/text&gt;
      &lt;text x=&quot;265&quot; y=&quot;476&quot; text-anchor=&quot;middle&quot; class=&quot;gc-muted&quot;&gt;먼 점 하나가 maxX를 바꾸므로 박스 중심이 크게 점프&lt;/text&gt;

      &lt;text x=&quot;555&quot; y=&quot;40&quot; class=&quot;gc-strong&quot;&gt;② 전체 픽셀 센트로이드&lt;/text&gt;
      &lt;text x=&quot;555&quot; y=&quot;70&quot; class=&quot;gc-muted&quot;&gt;중심 = (Σx ÷ N, Σy ÷ N)&lt;/text&gt;
      &lt;rect x=&quot;555&quot; y=&quot;95&quot; width=&quot;450&quot; height=&quot;315&quot; class=&quot;gc-grid&quot;&gt;&lt;/rect&gt;
      &lt;g id=&quot;gc3-centroid-points&quot;&gt;&lt;/g&gt;
      &lt;circle id=&quot;gc3-centroid-mark&quot; cx=&quot;0&quot; cy=&quot;0&quot; r=&quot;10&quot; class=&quot;gc-centroid&quot;&gt;&lt;/circle&gt;
      &lt;text id=&quot;gc3-centroid-label&quot; x=&quot;780&quot; y=&quot;444&quot; text-anchor=&quot;middle&quot; class=&quot;gc-strong&quot;&gt;&lt;/text&gt;
      &lt;text x=&quot;780&quot; y=&quot;476&quot; text-anchor=&quot;middle&quot; class=&quot;gc-muted&quot;&gt;먼 점의 비중은 전체 N개 중 1개라 이동량이 작음&lt;/text&gt;

      &lt;text x=&quot;1070&quot; y=&quot;40&quot; class=&quot;gc-strong&quot;&gt;③ 추적 게이트 + 센트로이드&lt;/text&gt;
      &lt;text x=&quot;1070&quot; y=&quot;70&quot; class=&quot;gc-muted&quot;&gt;게이트 밖 제거 → 남은 픽셀의 평균&lt;/text&gt;
      &lt;rect x=&quot;1070&quot; y=&quot;95&quot; width=&quot;450&quot; height=&quot;315&quot; class=&quot;gc-grid&quot;&gt;&lt;/rect&gt;
      &lt;rect x=&quot;1133&quot; y=&quot;190&quot; width=&quot;135&quot; height=&quot;126&quot; class=&quot;gc-gate&quot;&gt;&lt;/rect&gt;
      &lt;g id=&quot;gc3-gated-points&quot;&gt;&lt;/g&gt;
      &lt;line x1=&quot;1432&quot; y1=&quot;120&quot; x2=&quot;1462&quot; y2=&quot;150&quot; class=&quot;gc-reject&quot;&gt;&lt;/line&gt;
      &lt;line x1=&quot;1462&quot; y1=&quot;120&quot; x2=&quot;1432&quot; y2=&quot;150&quot; class=&quot;gc-reject&quot;&gt;&lt;/line&gt;
      &lt;circle id=&quot;gc3-gated-mark&quot; cx=&quot;0&quot; cy=&quot;0&quot; r=&quot;10&quot; class=&quot;gc-centroid&quot;&gt;&lt;/circle&gt;
      &lt;text id=&quot;gc3-gated-label&quot; x=&quot;1295&quot; y=&quot;444&quot; text-anchor=&quot;middle&quot; class=&quot;gc-strong&quot;&gt;&lt;/text&gt;
      &lt;text x=&quot;1295&quot; y=&quot;476&quot; text-anchor=&quot;middle&quot; class=&quot;gc-muted&quot;&gt;다른 녹색 물체를 먼저 제외하므로 가장 안정적&lt;/text&gt;
    &lt;/svg&gt;
  &lt;/section&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;green-centroid-lab-v3&#x27;);
      if (!root) return;
      const q = (id) =&gt; root.querySelector(&#x27;#&#x27; + id);
      const ns = &#x27;http://www.w3.org/2000/svg&#x27;;
      const svgEl = (name, attrs = {}) =&gt; {
        const el = document.createElementNS(ns, name);
        Object.entries(attrs).forEach(([key, value]) =&gt; el.setAttribute(key, String(value)));
        return el;
      };

      const cols = 12;
      const rows = 9;
      const cells = [];
      for (let y = 0; y &lt; rows; y += 1) {
        for (let x = 0; x &lt; cols; x += 1) {
          const dx = x - 6.2;
          const dy = y - 4.2;
          const inMarker = (dx * dx / 8.5 + dy * dy / 5.0) &lt; 1;
          const confusingBright = (x &lt;= 2 &amp;&amp; y &gt;= 1 &amp;&amp; y &lt;= 5) || (x === 10 &amp;&amp; y &gt;= 5);
          const darkGreen = (x &gt;= 8 &amp;&amp; x &lt;= 10 &amp;&amp; y &lt;= 2);
          let r = 18 + ((x * 7 + y * 3) % 8);
          let g = 20 + ((x * 5 + y * 2) % 7);
          let b = 17 + ((x * 3 + y * 5) % 8);
          let kind = &#x27;background&#x27;;
          if (inMarker) {
            r = 10 + ((x + y) % 5);
            g = 35 + ((x * 3 + y) % 12);
            b = 8 + ((x + y * 2) % 5);
            kind = &#x27;marker&#x27;;
          } else if (confusingBright) {
            r = 34 + ((x + y) % 7);
            g = 38 + ((x * 2 + y) % 7);
            b = 32 + ((x + y * 3) % 7);
            kind = &#x27;other&#x27;;
          } else if (darkGreen) {
            r = 3;
            g = 13 + ((x + y) % 3);
            b = 3;
            kind = &#x27;marker&#x27;;
          }
          cells.push({x, y, r, g, b, kind});
        }
      }

      const sampledNodes = [];
      const maskNodes = [];
      const erodedNodes = [];
      const gatedNodes = [];
      const makeGrid = (groupId, originX, originY, cellSize, gap, sourceClass) =&gt; {
        const group = q(groupId);
        const nodes = [];
        cells.forEach((cell) =&gt; {
          const rect = svgEl(&#x27;rect&#x27;, {
            x: originX + cell.x * (cellSize + gap),
            y: originY + cell.y * (cellSize + gap),
            width: cellSize,
            height: cellSize,
            rx: 2,
            class: sourceClass ? (cell.kind === &#x27;marker&#x27; ? &#x27;gc-target&#x27; : (cell.kind === &#x27;other&#x27; ? &#x27;gc-other&#x27; : &#x27;gc-grid&#x27;)) : &#x27;gc-fail&#x27;
          });
          group.appendChild(rect);
          nodes.push(rect);
        });
        return nodes;
      };

      const inputGroup = q(&#x27;gc3-stage-input&#x27;);
      for (let sy = 0; sy &lt; rows * 2; sy += 1) {
        for (let sx = 0; sx &lt; cols * 2; sx += 1) {
          const cell = cells[Math.floor(sy / 2) * cols + Math.floor(sx / 2)];
          inputGroup.appendChild(svgEl(&#x27;rect&#x27;, {
            x: 84 + sx * 13,
            y: 137 + sy * 13,
            width: 11,
            height: 11,
            rx: 1,
            class: cell.kind === &#x27;marker&#x27; ? &#x27;gc-target&#x27; : (cell.kind === &#x27;other&#x27; ? &#x27;gc-other&#x27; : &#x27;gc-grid&#x27;)
          }));
        }
      }
      sampledNodes.push(...makeGrid(&#x27;gc3-stage-sampled&#x27;, 575, 137, 25, 3, true));
      maskNodes.push(...makeGrid(&#x27;gc3-stage-mask&#x27;, 1083, 137, 28, 3, false));
      erodedNodes.push(...makeGrid(&#x27;gc3-stage-eroded&#x27;, 75, 590, 25, 3, false));
      gatedNodes.push(...makeGrid(&#x27;gc3-stage-gated&#x27;, 575, 590, 25, 3, false));

      const pass = (g, other, minG, minExcess) =&gt; g &gt;= minG &amp;&amp; (g - other) &gt; minExcess;
      const updatePipeline = () =&gt; {
        const minG = Number(q(&#x27;gc3-min-green&#x27;).value);
        const minExcess = Number(q(&#x27;gc3-min-excess&#x27;).value);
        q(&#x27;gc3-min-green-value&#x27;).textContent = minG;
        q(&#x27;gc3-min-excess-value&#x27;).textContent = minExcess;
        q(&#x27;gc3-detect-formula&#x27;).textContent = `G≥${minG} 그리고 G−max(R,B)&gt;${minExcess} 이면 1`;

        const hits = cells.map((cell) =&gt; pass(cell.g, Math.max(cell.r, cell.b), minG, minExcess));
        const eroded = hits.map((hit, index) =&gt; {
          const x = index % cols;
          return hit &amp;&amp; x &gt; 0 &amp;&amp; x &lt; cols - 1 &amp;&amp; hits[index - 1] &amp;&amp; hits[index + 1];
        });
        const gateCenter = {x: 6.2, y: 4.2};
        const gated = eroded.map((hit, index) =&gt; {
          const x = index % cols;
          const y = Math.floor(index / cols);
          return hit &amp;&amp; Math.abs(x - gateCenter.x) &lt;= 2 &amp;&amp; Math.abs(y - gateCenter.y) &lt;= 2;
        });

        let hitCount = 0;
        let erodeCount = 0;
        let gateCount = 0;
        let sumX = 0;
        let sumY = 0;
        cells.forEach((cell, index) =&gt; {
          maskNodes[index].setAttribute(&#x27;class&#x27;, hits[index] ? &#x27;gc-pass&#x27; : &#x27;gc-fail&#x27;);
          erodedNodes[index].setAttribute(&#x27;class&#x27;, eroded[index] ? &#x27;gc-pass&#x27; : &#x27;gc-fail&#x27;);
          gatedNodes[index].setAttribute(&#x27;class&#x27;, gated[index] ? &#x27;gc-pass&#x27; : &#x27;gc-fail&#x27;);
          if (hits[index]) hitCount += 1;
          if (eroded[index]) erodeCount += 1;
          if (gated[index]) {
            gateCount += 1;
            sumX += cell.x;
            sumY += cell.y;
          }
        });
        q(&#x27;gc3-mask-count&#x27;).textContent = `검출 ${hitCount} / ${cells.length} pixel`;
        q(&#x27;gc3-erode-count&#x27;).textContent = `${hitCount} → ${erodeCount} pixel · 작은 점 제거`;
        q(&#x27;gc3-gate-count&#x27;).textContent = `${erodeCount} → ${gateCount} pixel · 게이트 안만 유지`;

        const centroidGroup = q(&#x27;gc3-stage-centroid&#x27;);
        centroidGroup.replaceChildren();
        gated.forEach((hit, index) =&gt; {
          if (!hit) return;
          const x = index % cols;
          const y = Math.floor(index / cols);
          centroidGroup.appendChild(svgEl(&#x27;circle&#x27;, {cx: 1100 + x * 30, cy: 605 + y * 27, r: 7, class: &#x27;gc-target&#x27;}));
        });
        if (gateCount &gt; 0) {
          const cx = sumX / gateCount;
          const cy = sumY / gateCount;
          const px = 1100 + cx * 30;
          const py = 605 + cy * 27;
          q(&#x27;gc3-stage-center&#x27;).setAttribute(&#x27;cx&#x27;, px);
          q(&#x27;gc3-stage-center&#x27;).setAttribute(&#x27;cy&#x27;, py);
          q(&#x27;gc3-center-h&#x27;).setAttribute(&#x27;x1&#x27;, px - 15);
          q(&#x27;gc3-center-h&#x27;).setAttribute(&#x27;x2&#x27;, px + 15);
          q(&#x27;gc3-center-h&#x27;).setAttribute(&#x27;y1&#x27;, py);
          q(&#x27;gc3-center-h&#x27;).setAttribute(&#x27;y2&#x27;, py);
          q(&#x27;gc3-center-v&#x27;).setAttribute(&#x27;x1&#x27;, px);
          q(&#x27;gc3-center-v&#x27;).setAttribute(&#x27;x2&#x27;, px);
          q(&#x27;gc3-center-v&#x27;).setAttribute(&#x27;y1&#x27;, py - 15);
          q(&#x27;gc3-center-v&#x27;).setAttribute(&#x27;y2&#x27;, py + 15);
          const history = [[-18, 8], [-10, 3], [-5, -4], [2, 2], [0, 0]];
          history.forEach((offset, index) =&gt; centroidGroup.appendChild(svgEl(&#x27;circle&#x27;, {
            cx: px + offset[0],
            cy: py + offset[1],
            r: 4 + index,
            fill: &#x27;none&#x27;,
            stroke: &#x27;var(--viz-series-1)&#x27;,
            &#x27;stroke-width&#x27;: 1,
            opacity: .25 + index * .15
          })));
          q(&#x27;gc3-centroid-value&#x27;).textContent = `centroid (${Math.round(cx * 320 / 12)}, ${Math.round(cy * 240 / 9)}) → 최근 5개 좌표 평균`;
        } else {
          q(&#x27;gc3-stage-center&#x27;).setAttribute(&#x27;cx&#x27;, -50);
          q(&#x27;gc3-center-h&#x27;).setAttribute(&#x27;x1&#x27;, -50);
          q(&#x27;gc3-center-h&#x27;).setAttribute(&#x27;x2&#x27;, -50);
          q(&#x27;gc3-center-v&#x27;).setAttribute(&#x27;x1&#x27;, -50);
          q(&#x27;gc3-center-v&#x27;).setAttribute(&#x27;x2&#x27;, -50);
          q(&#x27;gc3-centroid-value&#x27;).textContent = &#x27;유효 픽셀이 없어 중심 없음&#x27;;
        }
      };

      const stageDetails = [
        &#x27;① OV7670에서 640×480 RGB565 픽셀이 순서대로 들어온다.&#x27;,
        &#x27;② 추적 계산량을 줄이기 위해 x와 y가 짝수인 픽셀만 사용한다. 좌표계는 320×240이 된다.&#x27;,
        &#x27;③ 각 픽셀에서 G≥MIN_GREEN과 G−max(R,B)&gt;MIN_EXCESS를 모두 만족할 때만 1로 만든다.&#x27;,
        &#x27;④ 가로로 연속된 3픽셀이 모두 1인 중심 픽셀만 남겨 단독 잡음점을 제거한다.&#x27;,
        &#x27;⑤ 추적 중에는 이전 중심에서 x·y 각각 48픽셀 이내의 검출만 누적해 다른 녹색 물체를 제외한다.&#x27;,
        &#x27;⑥ 남은 픽셀 좌표의 평균을 센트로이드로 구하고 최근 5프레임 좌표를 다시 평균해 흔들림을 줄인다.&#x27;
      ];
      root.querySelectorAll(&#x27;.gc3-step&#x27;).forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
        const step = Number(button.dataset.step);
        root.querySelectorAll(&#x27;.gc3-step&#x27;).forEach((peer) =&gt; peer.setAttribute(&#x27;aria-pressed&#x27;, String(peer === button)));
        for (let index = 1; index &lt;= 6; index += 1) q(`gc3-panel-${index}`).setAttribute(&#x27;class&#x27;, `gc-stage-panel${index === step ? &#x27; is-active&#x27; : &#x27;&#x27;}`);
        q(&#x27;gc3-stage-detail&#x27;).textContent = stageDetails[step - 1];
      }));
      [&#x27;gc3-min-green&#x27;, &#x27;gc3-min-excess&#x27;].forEach((id) =&gt; q(id).addEventListener(&#x27;input&#x27;, updatePipeline));

      const cluster = [];
      for (let i = 0; i &lt; 36; i += 1) {
        const angle = i * 2.399;
        const radius = 10 + (i % 7) * 4.2;
        cluster.push({x: 0.29 + Math.cos(angle) * radius / 430, y: 0.50 + Math.sin(angle) * radius / 300});
      }
      const drawCluster = (groupId, x0, y0, width, height, includeOutlier, fadedOutlier = false) =&gt; {
        const group = q(groupId);
        cluster.forEach((p) =&gt; group.appendChild(svgEl(&#x27;circle&#x27;, {
          cx: x0 + p.x * width,
          cy: y0 + p.y * height,
          r: 6,
          class: &#x27;gc-target&#x27;
        })));
        if (includeOutlier) {
          const dot = svgEl(&#x27;circle&#x27;, {cx: x0 + 0.84 * width, cy: y0 + 0.14 * height, r: 7, class: fadedOutlier ? &#x27;gc-fail&#x27; : &#x27;gc-target&#x27;});
          group.appendChild(dot);
        }
      };

      const drawGateCluster = (groupId, x0, y0, width, height, centerX, includeOutlier) =&gt; {
        const group = q(groupId);
        cluster.forEach((p) =&gt; group.appendChild(svgEl(&#x27;circle&#x27;, {
          cx: x0 + (p.x + centerX - .29) * width,
          cy: y0 + p.y * height,
          r: 6,
          class: &#x27;gc-target&#x27;
        })));
        if (includeOutlier) group.appendChild(svgEl(&#x27;circle&#x27;, {
          cx: x0 + .84 * width,
          cy: y0 + .14 * height,
          r: 7,
          class: &#x27;gc-target&#x27;
        }));
      };
      drawGateCluster(&#x27;gc3-gate-first&#x27;, 40, 70, 430, 300, .50, false);
      drawGateCluster(&#x27;gc3-gate-next&#x27;, 555, 70, 430, 300, .55, true);
      drawGateCluster(&#x27;gc3-gate-accepted&#x27;, 1070, 70, 450, 300, .55, false);

      const comparePanels = [
        {id: &#x27;gc3-midpoint-points&#x27;, x: 40, y: 95},
        {id: &#x27;gc3-centroid-points&#x27;, x: 555, y: 95},
        {id: &#x27;gc3-gated-points&#x27;, x: 1070, y: 95}
      ];
      comparePanels.forEach((panel, index) =&gt; drawCluster(panel.id, panel.x, panel.y, 450, 315, index &lt; 2, index === 2));

      const all = cluster.concat([{x: .84, y: .14}]);
      const minX = Math.min(...all.map((p) =&gt; p.x));
      const maxX = Math.max(...all.map((p) =&gt; p.x));
      const minY = Math.min(...all.map((p) =&gt; p.y));
      const maxY = Math.max(...all.map((p) =&gt; p.y));
      const midpoint = {x: (minX + maxX) / 2, y: (minY + maxY) / 2};
      const centroidAll = {
        x: all.reduce((sum, p) =&gt; sum + p.x, 0) / all.length,
        y: all.reduce((sum, p) =&gt; sum + p.y, 0) / all.length
      };
      const centroidGate = {
        x: cluster.reduce((sum, p) =&gt; sum + p.x, 0) / cluster.length,
        y: cluster.reduce((sum, p) =&gt; sum + p.y, 0) / cluster.length
      };
      const trueCenter = {x: .29, y: .50};
      const error = (point) =&gt; Math.round(Math.hypot((point.x - trueCenter.x) * 320, (point.y - trueCenter.y) * 240));
      const mapPoint = (point, x0, y0) =&gt; ({x: x0 + point.x * 450, y: y0 + point.y * 315});

      const boxX = 40 + minX * 450;
      const boxY = 95 + minY * 315;
      q(&#x27;gc3-bbox&#x27;).setAttribute(&#x27;x&#x27;, boxX);
      q(&#x27;gc3-bbox&#x27;).setAttribute(&#x27;y&#x27;, boxY);
      q(&#x27;gc3-bbox&#x27;).setAttribute(&#x27;width&#x27;, (maxX - minX) * 450);
      q(&#x27;gc3-bbox&#x27;).setAttribute(&#x27;height&#x27;, (maxY - minY) * 315);
      const midpointPx = mapPoint(midpoint, 40, 95);
      q(&#x27;gc3-midpoint-mark&#x27;).setAttribute(&#x27;cx&#x27;, midpointPx.x);
      q(&#x27;gc3-midpoint-mark&#x27;).setAttribute(&#x27;cy&#x27;, midpointPx.y);
      q(&#x27;gc3-midpoint-label&#x27;).textContent = `기준 중심에서 약 ${error(midpoint)} pixel 이동`;

      const centroidPx = mapPoint(centroidAll, 555, 95);

      q(&#x27;gc3-centroid-mark&#x27;).setAttribute(&#x27;cy&#x27;, centroidPx.y);

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
